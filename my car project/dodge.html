<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>this wadley first site in HTML</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 10px;
      color: #e94560;
      text-shadow: 0 0 12px #e94560;
      letter-spacing: 2px;
    }

    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #score { color: #f5d020; }
    #best  { color: #0f3460; background:#e94560; padding:2px 10px; border-radius:8px; }

    #gameCanvas {
      border: 3px solid #e94560;
      border-radius: 6px;
      box-shadow: 0 0 30px #e94560aa;
      display: block;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(26,26,46,0.92);
      border: 2px solid #e94560;
      border-radius: 16px;
      padding: 40px 60px;
      box-shadow: 0 0 40px #e94560aa;
    }

    #overlay h2 { font-size: 2rem; color: #e94560; }
    #overlay p  { font-size: 1rem; color: #ccc; text-align:center; max-width:260px; }

    #startBtn {
      padding: 12px 36px;
      background: #e94560;
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform .1s, box-shadow .1s;
      box-shadow: 0 4px 18px #e9456088;
    }
    #startBtn:hover { transform: scale(1.07); box-shadow: 0 6px 24px #e94560cc; }

    #controls {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
    }

    #share-section {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #share-section span { font-size: 0.85rem; color: #aaa; }

    #share-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .share-btn {
      padding: 7px 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: transform .1s;
    }
    .share-btn:hover { transform: scale(1.08); }

    #copyBtn   { background: #0f3460; color: #fff; }
    #tweetBtn  { background: #1da1f2; color: #fff; }
    #waBtn     { background: #25d366; color: #fff; }

    #copyMsg { font-size: 0.8rem; color: #f5d020; display:none; }
  </style>
</head>
<body>

  <h1>🏎️ this wadley first site in HTML 🏎️</h1>

  <div id="score-board">
    <span>Score: <span id="score">0</span></span>
    <span id="best">Best: <span id="bestScore">0</span></span>
  </div>

  <div style="position:relative; display:inline-block;">
    <canvas id="gameCanvas" width="400" height="560"></canvas>

    <div id="overlay">
      <h2>🏁 CAR DODGE</h2>
      <p>Dodge the traffic — survive as long as you can!</p>
      <button id="startBtn">▶ START</button>
      <div id="controls">
        ← → Arrow keys &nbsp;|&nbsp; A / D &nbsp;|&nbsp; Tap left/right
      </div>
    </div>
  </div>

  <div id="share-section">
    <span>🔗 Share this game with friends!</span>
    <div id="share-btns">
      <button class="share-btn" id="copyBtn">📋 Copy Link</button>
      <button class="share-btn" id="tweetBtn">🐦 Tweet</button>
      <button class="share-btn" id="waBtn">💬 WhatsApp</button>
    </div>
    <span id="copyMsg">✅ Link copied!</span>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let gameRunning = false, animId;
let score = 0, bestScore = 0, frame = 0;

const ROAD_X = 40, ROAD_W = 320;
const LANE_W = ROAD_W / 3;
const laneX = [ROAD_X + LANE_W*0 + LANE_W/2,
               ROAD_X + LANE_W*1 + LANE_W/2,
               ROAD_X + LANE_W*2 + LANE_W/2];

const PLAYER_W = 46, PLAYER_H = 70;
let player = { lane: 1, x: laneX[1], y: H - 100, w: PLAYER_W, h: PLAYER_H,
               moving: false, targetX: laneX[1] };

let obstacles = [];
let dashOffset = 0;
let spawnTimer = 0, spawnInterval = 90;

document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  if ((e.key==='ArrowLeft'||e.key==='a'||e.key==='A') && player.lane > 0)  moveLane(-1);
  if ((e.key==='ArrowRight'||e.key==='d'||e.key==='D') && player.lane < 2) moveLane(+1);
});

let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if (!gameRunning || touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -30 && player.lane > 0) moveLane(-1);
  if (dx >  30 && player.lane < 2) moveLane(+1);
  touchStartX = null;
}, {passive:true});

function moveLane(dir) {
  player.lane = Math.max(0, Math.min(2, player.lane + dir));
  player.targetX = laneX[player.lane];
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  obstacles = []; score = 0; frame = 0; spawnTimer = 0; spawnInterval = 90;
  player.lane = 1; player.x = laneX[1]; player.targetX = laneX[1];
  gameRunning = true;
  loop();
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  if (score > bestScore) bestScore = score;
  document.getElementById('bestScore').textContent = bestScore;
  const ov = document.getElementById('overlay');
  ov.querySelector('h2').textContent = '💥 GAME OVER';
  ov.querySelector('p').textContent  = `Your score: ${score}  |  Best: ${bestScore}`;
  document.getElementById('startBtn').textContent = '🔄 PLAY AGAIN';
  ov.style.display = 'flex';
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6'];
  obstacles.push({
    lane, x: laneX[lane],
    y: -PLAYER_H - 10,
    w: PLAYER_W, h: PLAYER_H,
    speed: 4 + score * 0.01,
    color: colors[Math.floor(Math.random()*colors.length)]
  });
}

function loop() {
  animId = requestAnimationFrame(loop);
  frame++;
  update();
  draw();
}

function update() {
  player.x += (player.targetX - player.x) * 0.18;
  dashOffset = (dashOffset + 6) % 60;

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnObstacle();
    spawnTimer = 0;
    spawnInterval = Math.max(38, spawnInterval - 0.5);
  }

  obstacles.forEach(o => o.y += o.speed + score * 0.005);
  obstacles = obstacles.filter(o => o.y < H + 80);

  for (const o of obstacles) {
    const px = player.x - player.w/2, py = player.y - player.h/2;
    const ox = o.x - o.w/2,          oy = o.y - o.h/2;
    if (px < ox + o.w && px + player.w > ox &&
        py < oy + o.h && py + player.h > oy) {
      endGame(); return;
    }
  }

  score++;
  document.getElementById('score').textContent = score;
}

function drawRoad() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2c2c3e';
  ctx.fillRect(ROAD_X, 0, ROAD_W, H);
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(ROAD_X,0); ctx.lineTo(ROAD_X,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ROAD_X+ROAD_W,0); ctx.lineTo(ROAD_X+ROAD_W,H); ctx.stroke();
  ctx.strokeStyle = '#ffffff44';
  ctx.lineWidth = 2;
  ctx.setLineDash([30, 30]);
  ctx.lineDashOffset = -dashOffset;
  for (let i = 1; i < 3; i++) {
    const lx = ROAD_X + LANE_W * i;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCar(x, y, w, h, color, isPlayer) {
  const cx = x - w/2, cy = y - h/2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(cx+4, cy+10, w-8, h-20, 8);
  ctx.fill();
  ctx.fillStyle = isPlayer ? '#fff' : '#ddd';
  ctx.beginPath();
  ctx.roundRect(cx+9, cy+20, w-18, h-45, 6);
  ctx.fill();
  ctx.fillStyle = '#111';
  [[cx, cy+10],[cx+w-8,cy+10],[cx,cy+h-22],[cx+w-8,cy+h-22]].forEach(([wx,wy])=>{
    ctx.beginPath(); ctx.roundRect(wx, wy, 8, 16, 3); ctx.fill();
  });
  if (isPlayer) {
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath(); ctx.ellipse(cx+8, cy+12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+w-8, cy+12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = '#f5d020';
    ctx.shadowBlur  = 18;
    ctx.fillStyle = 'transparent';
    ctx.beginPath(); ctx.roundRect(cx+4, cy+10, w-8, h-20, 8); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.ellipse(cx+8, cy+h-12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+w-8, cy+h-12, 5, 4, 0, 0, Math.PI*2); ctx.fill();
  }
}

function draw() {
  drawRoad();
  obstacles.forEach(o => drawCar(o.x, o.y, o.w, o.h, o.color, false));
  drawCar(player.x, player.y, player.w, player.h, '#f5d020', true);
}

drawRoad();
drawCar(laneX[1], H-100, PLAYER_W, PLAYER_H, '#f5d020', true);

document.getElementById('startBtn').addEventListener('click', startGame);

const pageUrl = window.location.href;
const shareText = "🏎️ Try Wadley's Car Dodge game! Can you beat my score? 👇";

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(pageUrl).then(() => {
    const msg = document.getElementById('copyMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  });
});

document.getElementById('tweetBtn').addEventListener('click', () => {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(pageUrl)}`, '_blank');
});

document.getElementById('waBtn').addEventListener('click', () => {
  window.open(`https://wa.me/?text=${encodeURIComponent(shareText + ' ' + pageUrl)}`, '_blank');
});
</script>
</body>
</html>
